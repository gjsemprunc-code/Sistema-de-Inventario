<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventario TI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2433;--mut:#6b7385;--line:#e4e7ec;--pri:#0b5cad;--pri2:#e8f1fb;--ok:#13795b;--okb:#e6f4ee;--warn:#a35c00;--warnb:#fdf1df;--bad:#b42318;--badb:#fdecea;--side:#0f2340}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
.app{display:flex;min-height:100vh}
nav{width:220px;background:var(--side);color:#c9d3e3;padding:18px 12px;flex-shrink:0;position:sticky;top:0;height:100vh}
nav .brand{color:#fff;font-weight:700;font-size:15px;padding:4px 10px 18px;line-height:1.3}
nav .brand small{display:block;font-weight:400;color:#8ea0bd;font-size:12px}
nav a{display:flex;justify-content:space-between;padding:9px 10px;border-radius:7px;color:inherit;text-decoration:none;margin-bottom:2px;cursor:pointer}
nav a:hover{background:#1b3358}
nav a.on{background:#24467a;color:#fff}
nav .pill{background:#b42318;color:#fff;border-radius:10px;font-size:11px;padding:1px 7px}
main{flex:1;padding:24px 28px;min-width:0}
h1{font-size:21px;margin:0 0 4px}
.sub{color:var(--mut);margin-bottom:20px}
.grid{display:grid;gap:14px}
.k4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.kpi .v{font-size:26px;font-weight:700;margin-top:4px}
.kpi .l{color:var(--mut);font-size:12.5px}
.kpi .h{font-size:12px;color:var(--mut);margin-top:4px}
h2{font-size:15px;margin:0 0 12px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--mut);font-size:12px;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid #f0f2f5;vertical-align:top}
tr.click:hover td{background:#f7f9fc;cursor:pointer}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11.5px;font-weight:500;white-space:nowrap}
.t-ok{background:var(--okb);color:var(--ok)}.t-warn{background:var(--warnb);color:var(--warn)}.t-bad{background:var(--badb);color:var(--bad)}.t-mut{background:#eef0f3;color:var(--mut)}.t-pri{background:var(--pri2);color:var(--pri)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}
input[type=search]{min-width:260px}
button{font:inherit;padding:7px 13px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink)}
button.p{background:var(--pri);border-color:var(--pri);color:#fff}
button.d{color:var(--bad)}
button:hover{filter:brightness(.97)}
.mut{color:var(--mut)}.sm{font-size:12px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.row{display:flex;gap:14px;flex-wrap:wrap}.row>*{flex:1;min-width:280px}
.modal{position:fixed;inset:0;background:rgba(15,35,64,.45);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:20}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:12px;max-width:920px;width:100%;padding:22px 24px;position:relative}
.mbox .x{position:absolute;right:14px;top:12px;border:none;font-size:20px;background:none}
.sec{margin-top:18px}.sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:0 0 8px}
.alert{border-left:3px solid var(--warn);background:var(--warnb);padding:9px 12px;border-radius:6px;margin-bottom:8px}
.alert.bad{border-color:var(--bad);background:var(--badb)}
.meter{height:8px;background:#eef0f3;border-radius:5px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;background:var(--pri)}
.empty{padding:26px;text-align:center;color:var(--mut)}
.toast{position:fixed;bottom:20px;right:20px;background:var(--side);color:#fff;padding:11px 16px;border-radius:8px;display:none;z-index:40}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f0f2f5}
.acta{font-family:Georgia,serif;color:#000;padding:10px 6px}
.acta h2{text-align:center;font-size:17px;letter-spacing:.05em}
.acta table td,.acta table th{border:1px solid #999;padding:6px;font-size:12.5px;color:#000}
.firmas{display:flex;gap:40px;margin-top:60px}.firmas div{flex:1;border-top:1px solid #000;text-align:center;padding-top:6px;font-size:12px}
@media print{body *{visibility:hidden}#actaTxt,#actaTxt *{visibility:visible}#actaTxt{position:absolute;left:0;top:0;width:100%}.modal{position:absolute;padding:0;background:none}}
.lectura .adm{display:none!important}
.banner{background:var(--pri2);color:var(--pri);padding:9px 14px;border-radius:8px;margin-bottom:16px;font-size:13px}
label.f{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
label.f+input,label.f+select{width:100%}
@media(max-width:800px){nav{width:62px;padding:12px 6px}nav .brand,nav a span.t{display:none}main{padding:16px}}
</style>
</head>
<body>
<div class="app">
<nav>
  <div class="brand">Inventario TI<small>Dotación de funcionarios</small></div>
  <a data-v="panel"><span class="t">Panel</span></a>
  <a data-v="funcionarios"><span class="t">Funcionarios</span></a>
  <a data-v="activos"><span class="t">Activos</span></a>
  <a data-v="bodega"><span class="t">Bodega y accesorios</span></a>
  <a data-v="licencias"><span class="t">Licencias</span></a>
  <a data-v="fea"><span class="t">Firma electrónica</span></a>
  <a data-v="egresos"><span class="t">Egresos</span><span class="pill" id="pEg"></span></a>
  <a data-v="calidad"><span class="t">Calidad de datos</span></a>
</nav>
<main id="main"></main>
</div>
<div class="modal" id="modal"><div class="mbox"><button class="x" onclick="closeM()">×</button><div id="mbody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const TODAY = new Date().toISOString().slice(0,10);
let D,F,A,P,ROL='admin';
function build(){
  F = Object.fromEntries(D.funcionarios.map(f=>[f.id,f]));
  A = Object.fromEntries(D.activos.map(a=>[a.id,a]));
  P = Object.fromEntries(D.productos.map(p=>[p.codigo,p]));
  D.licencias_asig = D.licencias_asig.filter(l=>l.vigente!==false);
}
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nom = f => f ? `${f.nombres} ${f.paterno} ${f.materno}`.trim() : '';
const nomC = f => f ? `${f.nombres.split(' ')[0]} ${f.paterno}` : '';
const clp = n => '$'+Math.round(n).toLocaleString('es-CL');
const fd = s => s ? s.split('-').reverse().join('-') : '—';
const days = s => Math.round((new Date(s)-new Date(TODAY))/864e5);
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',2600);}
function tagEstado(s){const m={'Activo':'t-ok','Asignado':'t-pri','Disponible':'t-ok','Activa':'t-ok','Inactivo':'t-mut','Inactiva':'t-mut','Devuelto':'t-mut','Pendiente':'t-warn','En bodega':'t-ok','En oficina':'t-mut','BACKUP':'t-warn'};return `<span class="tag ${m[s]||'t-mut'}">${esc(s)}</span>`;}

// ---------- derivados ----------
function vigentes(fid){ return D.asignaciones.filter(x=>x.funcionario===fid && x.vigente).map(x=>({...x,a:A[x.activo]})); }
function historial(fid){ return D.asignaciones.filter(x=>x.funcionario===fid && !x.vigente).map(x=>({...x,a:A[x.activo]})); }
function titular(aid){ const x=D.asignaciones.find(z=>z.activo===aid && z.vigente); return x?F[x.funcionario]:null; }
function stock(cod){ const p=P[cod]; const ent=D.entregas.filter(e=>e.codigo===cod).reduce((s,e)=>s+e.cantidad,0); return {ingresado:p.ingresado,entregado:ent,stock:p.ingresado-ent}; }
function claudePool(){ return D.licencias.find(l=>l.id==='L-CLAUDE'); }
function claudeCfg(){ const p=claudePool(); return p&&!p.pendiente?{plan:p.plan,std:p.cupos_std||0,prem:p.cupos_prem||0,ren:p.renovacion,cupos:(p.cupos_std||0)+(p.cupos_prem||0)}:null; }
function claudeAsig(){ return D.licencias_asig.filter(l=>l.pool==='L-CLAUDE'); }
function licDe(fid){
  const r=D.licencias_asig.filter(l=>l.funcionario===fid).map(l=>{const p=D.licencias.find(x=>x.id===l.pool);return {prod:p.producto,plan:p.producto==='Claude'?l.tipo:p.plan,desde:l.desde};});
  return r;
}
function feaDe(fid){ return D.fea.filter(f=>f.funcionario===fid); }
function accDe(fid){ return D.entregas.filter(e=>e.funcionario===fid); }
function egresosPend(){
  return D.funcionarios.filter(f=>f.estado==='Inactivo').map(f=>{
    const act=vigentes(f.id), lic=licDe(f.id), fe=feaDe(f.id).filter(x=>x.estado==='Activa');
    return {f,act,lic,fe,n:act.length+lic.length+fe.length};
  }).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
}
let DIVS=[];

// ---------- vistas ----------
const V={};
V.panel=()=>{
  const act=D.funcionarios.filter(f=>f.estado==='Activo').length;
  const comp=D.activos.filter(a=>a.categoria==='Computador'), pant=D.activos.filter(a=>a.categoria==='Pantalla');
  const valor=D.productos.reduce((s,p)=>s+stock(p.codigo).stock*p.precio,0);
  const bajos=D.productos.filter(p=>stock(p.codigo).stock<=p.stock_min);
  const fv=D.fea.filter(f=>f.estado==='Activa'&&f.vence&&days(f.vence)<=60);
  const eg=egresosPend();
  const dual=D.funcionarios.filter(f=>f.estado==='Activo'&&vigentes(f.id).filter(x=>x.a.categoria==='Pantalla').length>1);
  const multi=D.funcionarios.filter(f=>f.estado==='Activo'&&vigentes(f.id).filter(x=>x.a.categoria==='Computador').length>1);
  const adobeU=D.licencias_asig.filter(l=>l.pool.startsWith('L-ADOBE')).length, adobeT=D.licencias.filter(l=>l.producto==='Adobe').reduce((s,l)=>s+l.cupos,0);
  return `<h1>Panel</h1><div class="sub">Datos importados desde la planilla de dotación 2026 y la factura N° 16498 · ${fd(TODAY)}</div>
  ${BANNER}
  <div class="grid k4">
   <div class="card kpi"><div class="l">Funcionarios activos</div><div class="v">${act}</div><div class="h">${D.funcionarios.length-act} inactivos en registro</div></div>
   <div class="card kpi"><div class="l">Computadores</div><div class="v">${comp.length}</div><div class="h">${comp.filter(a=>a.estado==='Asignado').length} asignados · ${comp.filter(a=>a.estado==='Disponible').length} disponibles</div></div>
   <div class="card kpi"><div class="l">Pantallas</div><div class="v">${pant.length}</div><div class="h">${dual.length} funcionarios con 2 pantallas</div></div>
   <div class="card kpi"><div class="l">Celulares / Teléfonos IP</div><div class="v">${D.activos.filter(a=>a.categoria==='Celular').length} / ${D.activos.filter(a=>a.categoria==='Teléfono IP').length}</div><div class="h">${D.activos.filter(a=>a.categoria==='Celular'&&a.estado==='Asignado').length} celulares asignados</div></div>
   <div class="card kpi"><div class="l">Stock bodega (valor neto)</div><div class="v">${clp(valor)}</div><div class="h">${bajos.length?bajos.length+' producto(s) bajo mínimo':'Todo sobre stock mínimo'}</div></div>
   <div class="card kpi"><div class="l">Licencias Adobe</div><div class="v">${adobeU} / ${adobeT}</div><div class="h">Claude: ${claudeCfg()?claudeAsig().length+' / '+claudeCfg().cupos:'por configurar'}</div></div>
  </div>
  <div class="row" style="margin-top:14px">
   <div class="card"><h2>Alertas</h2>
    ${eg.length?`<div class="alert bad"><b>${eg.length} funcionarios inactivos</b> todavía tienen activos, licencias o FEA vigentes. <a href="#egresos">Revisar egresos</a></div>`:''}
    ${fv.length?`<div class="alert"><b>${fv.length} firmas electrónicas</b> activas vencen en los próximos 60 días. <a href="#fea">Ver</a></div>`:''}
    ${bajos.map(p=>`<div class="alert">Stock bajo: ${esc(p.descripcion)} (${stock(p.codigo).stock})</div>`).join('')}
    ${multi.length?`<div class="alert" style="border-color:var(--pri);background:var(--pri2)">${multi.length} funcionarios activos tienen 2 computadores asignados.</div>`:''}
    ${!claudeCfg()?`<div class="alert" style="border-color:var(--pri);background:var(--pri2)">El módulo de licencias Claude está pendiente de configurar (plan y cupos). <a href="#licencias">Configurar</a></div>`:''}
   </div>
   <div class="card"><h2>Computadores por modelo</h2>${tablaModelos(comp)}</div>
  </div>`;
};
function tablaModelos(list){
  const m={}; list.forEach(a=>{const k=a.marca+' '+a.modelo; m[k]=m[k]||{t:0,as:0,di:0}; m[k].t++; a.estado==='Asignado'?m[k].as++:m[k].di++;});
  return `<table><tr><th>Modelo</th><th>Total</th><th>Asignados</th><th>Disponibles</th></tr>${Object.entries(m).sort((a,b)=>b[1].t-a[1].t).slice(0,10).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${v.t}</td><td>${v.as}</td><td>${v.di}</td></tr>`).join('')}</table>`;
}
let fq='',fe='Activo',fdv='';
V.funcionarios=()=>{
  return `<h1>Funcionarios</h1><div class="sub">Haz clic en un funcionario para ver su ficha con todo lo asignado</div>
  <div class="card"><div class="bar"><input type="search" id="q" placeholder="Buscar por nombre, RUT o correo" value="${esc(fq)}">
  <select id="fe"><option value="">Todos los estados</option>${['Activo','Inactivo'].map(s=>`<option ${s===fe?'selected':''}>${s}</option>`).join('')}</select>
  <select id="fd"><option value="">Todas las divisiones</option>${DIVS.map(s=>`<option ${s===fdv?'selected':''}>${esc(s)}</option>`).join('')}</select><span class="mut sm" id="cnt"></span></div>
  <div id="ft"></div></div>`;
};
function renderF(){
  const q=fq.toLowerCase();
  const L=D.funcionarios.filter(f=>(!fe||f.estado===fe)&&(!fdv||f.division===fdv)&&(!q||(nom(f)+' '+f.rut+' '+f.correo).toLowerCase().includes(q)));
  document.getElementById('cnt').textContent=L.length+' resultados';
  document.getElementById('ft').innerHTML=`<table><tr><th>Nombre</th><th>RUT</th><th>División</th><th>Estado</th><th>Equipos</th><th>Pantallas</th><th>Otros</th></tr>
  ${L.slice(0,300).map(f=>{const v=vigentes(f.id);const c=v.filter(x=>x.a.categoria==='Computador').length,p=v.filter(x=>x.a.categoria==='Pantalla').length,o=v.length-c-p+licDe(f.id).length+feaDe(f.id).filter(x=>x.estado==='Activa').length;
  return `<tr class="click" onclick="ficha('${f.id}')"><td><b>${esc(nom(f))}</b><div class="mut sm">${esc(f.correo)}</div></td><td class="mono">${esc(f.rut)||'—'}</td><td>${esc(f.division)||'—'}</td><td>${tagEstado(f.estado)}${f.estado==='Inactivo'&&v.length?' <span class="tag t-bad">con activos</span>':''}</td><td>${c||'—'}</td><td>${p?(p>1?`<span class="tag t-pri">${p}</span>`:p):'—'}</td><td>${o||'—'}</td></tr>`;}).join('')}</table>`;
}
function ficha(id){
  const f=F[id], v=vigentes(id), h=historial(id), lic=licDe(id), fea=feaDe(id), acc=accDe(id);
  const fila=x=>`<tr><td>${esc(x.a.categoria)}</td><td>${esc(x.a.marca)} ${esc(x.a.modelo)}</td><td class="mono">${esc(x.a.serie||x.a.imei||'')}</td><td>${x.a.numero?esc(x.a.numero):(x.a.codigo?`<span class="mono">${esc(x.a.codigo)}</span>`:'')}</td><td>${x.acta_entrega?`<a href="${esc(x.acta_entrega)}" target="_blank">Acta</a>`:'<span class="mut sm">sin acta</span>'}${x.alerta?` <span class="tag t-bad">sin devolución</span>`:''}</td></tr>`;
  document.getElementById('mbody').innerHTML=`<h1>${esc(nom(f))}</h1><div class="sub">${tagEstado(f.estado)} · ${esc(f.division)||'Sin división'} · RUT <span class="mono">${esc(f.rut)||'—'}</span> · ${esc(f.correo)}</div>
  <div class="mut sm">${esc(f.direccion)} ${f.piso?'· Piso '+esc(f.piso):''} ${f.tarjeta?'· Tarjeta acceso '+esc(f.tarjeta):''} ${f.candado?'· Candado '+esc(f.candado):''} ${f.antivirus?'· Antivirus '+esc(f.antivirus):''}</div>
  <div class="bar" style="margin-top:14px"><button class="p" onclick="acta('${id}','entrega')">Generar acta de entrega</button><button class="adm" onclick="asignarForm('${id}')">Asignar activo</button><button class="adm" onclick="acta('${id}','devolucion')">Acta de devolución</button>${f.estado==='Inactivo'&&v.length?`<button class="d adm" onclick="egreso('${id}')">Proceso de egreso</button>`:''}</div>
  <div class="sec"><h3>Activos asignados (${v.length})</h3>${v.length?`<table><tr><th>Tipo</th><th>Equipo</th><th>Serie / IMEI</th><th>Código / Número</th><th></th></tr>${v.map(fila).join('')}</table>`:'<div class="mut">Sin activos asignados</div>'}</div>
  <div class="sec"><h3>Accesorios entregados (bodega)</h3>${acc.length?`<table><tr><th>Fecha</th><th>Producto</th><th>Cant.</th><th></th></tr>${acc.map(e=>`<tr><td>${fd(e.fecha)}</td><td>${esc(P[e.codigo].descripcion)}</td><td>${e.cantidad}</td><td>${e.acta?`<a href="${esc(e.acta)}" target="_blank">Acta</a>`:'<span class="mut sm">sin acta</span>'}</td></tr>`).join('')}</table>`:'<div class="mut">Ninguno</div>'}</div>
  <div class="row"><div class="sec"><h3>Licencias</h3>${lic.length?lic.map(l=>`<div>${tagEstado('Activa')} ${esc(l.prod)} – ${esc(l.plan)} <span class="mut sm">desde ${fd(l.desde)}</span></div>`).join(''):'<div class="mut">Ninguna</div>'}</div>
  <div class="sec"><h3>Firma electrónica</h3>${fea.length?fea.map(x=>`<div>${tagEstado(x.estado)} ${esc(x.proveedor)} ${x.vence?`<span class="mut sm">vence ${fd(x.vence)}</span>`:''}</div>`).join(''):'<div class="mut">No registra</div>'}</div></div>
  ${h.length?`<div class="sec"><h3>Historial (devueltos / reasignados)</h3><table>${h.map(x=>`<tr><td>${esc(x.a.categoria)}</td><td>${esc(x.a.marca)} ${esc(x.a.modelo)}</td><td class="mono">${esc(x.a.serie)}</td><td>${x.acta_devolucion?`<a href="${esc(x.acta_devolucion)}" target="_blank">Acta devolución</a>`:''} ${titular(x.activo)&&titular(x.activo).id!==id?'<span class="mut sm">hoy con '+esc(nomC(titular(x.activo)))+'</span>':''}</td></tr>`).join('')}</table></div>`:''}`;
  openM();
}
function acta(id,tipo){
  const f=F[id], v=tipo==='entrega'?vigentes(id):historial(id).concat(vigentes(id));
  document.getElementById('mbody').innerHTML=`<div class="bar"><button onclick="ficha('${id}')">← Volver a la ficha</button><button onclick="copyActa()">Copiar texto</button>${PRINT_BTN}</div>
  <div class="acta" id="actaTxt"><h2>ACTA DE ${tipo==='entrega'?'ENTREGA':'DEVOLUCIÓN'} DE ACTIVOS</h2>
  <p>En Santiago, a ${new Date().toLocaleDateString('es-CL',{day:'numeric',month:'long',year:'numeric'})}, la Unidad de Tecnologías de la Información ${tipo==='entrega'?'hace entrega a':'recibe de'} don(ña) <b>${esc(nom(f))}</b>, RUT <b>${esc(f.rut)}</b>, de la ${esc(f.division)}, los siguientes activos:</p>
  <table style="width:100%;border-collapse:collapse"><tr><th>N°</th><th>Tipo</th><th>Marca</th><th>Modelo</th><th>Serie</th><th>Cód. inventario</th></tr>
  ${v.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.a.categoria==='Computador'?x.a.tipo:x.a.categoria)}</td><td>${esc(x.a.marca)}</td><td>${esc(x.a.modelo)}</td><td>${esc(x.a.serie||x.a.imei)}</td><td>${esc(x.a.codigo)}</td></tr>`).join('')||'<tr><td colspan="6">—</td></tr>'}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let ME = null;

async function all(table, order){
  let out = [], from = 0;
  while(true){
    let q = sb.from(table).select('*').range(from, from + 999);
    if(order) q = q.order(order);
    const { data, error } = await q;
    if(error) throw error;
    out = out.concat(data); if(data.length < 1000) break; from += 1000;
  }
  return out;
}
const ok = ({error}) => { if(error) throw new Error(error.message); };
const hoy = () => new Date().toISOString().slice(0,10);

const S = {
  async load(){
    const [funcionarios, activos, asignaciones, licencias, licencias_asig, fea, productos, compras, compra_items, entregas, observaciones] = await Promise.all(
      ['funcionarios','activos','asignaciones','licencias','licencias_asig','fea','productos','compras','compra_items','entregas','observaciones'].map(t => all(t, t==='entregas'?'id':null)));
    productos.forEach(p => { p.ingresado = compra_items.filter(i => i.codigo === p.codigo).reduce((s,i) => s + i.cantidad, 0); p.precio = +p.precio; });
    compras.sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
    compras.forEach(c => c.items = compra_items.filter(i => i.compra === c.id));
    return { funcionarios, activos, asignaciones, licencias, licencias_asig, fea, productos, compras, entregas, observaciones };
  },
  async reload(){ D = await this.load(); build(); },
  async asignar(aid, fid){ ok(await sb.from('asignaciones').insert({ activo: aid, funcionario: fid })); await this.reload(); },
  async entregar(e){ const r = {...e}; if(!r.acta) delete r.acta; ok(await sb.from('entregas').insert(r)); await this.reload(); },
  async claudeCfg(patch){ ok(await sb.from('licencias').update(patch).eq('id','L-CLAUDE')); await this.reload(); },
  async claudeAsignar(fid, tipo){ ok(await sb.from('licencias_asig').insert({ pool:'L-CLAUDE', funcionario: fid, tipo })); await this.reload(); },
  async licLiberar(id){ ok(await sb.from('licencias_asig').update({ vigente:false, hasta: hoy() }).eq('id', id)); await this.reload(); },
  async egreso(fid){
    ok(await sb.from('asignaciones').update({ vigente:false, hasta: hoy(), alerta:null }).eq('funcionario', fid).eq('vigente', true));
    ok(await sb.from('licencias_asig').update({ vigente:false, hasta: hoy() }).eq('funcionario', fid).eq('vigente', true));
    ok(await sb.from('fea').update({ estado:'Inactiva' }).eq('funcionario', fid).eq('estado','Activa'));
    await this.reload();
  }
};

V.usuarios = () => `<h1>Control de acceso</h1><div class="sub">Solo cuentas @${DOMINIO}. Quien ingresa por primera vez queda como solicitud pendiente hasta que un administrador la apruebe.</div>
  <div class="card"><h2>Solicitudes pendientes <span class="tag t-warn" id="nSol"></span></h2><div id="solT">Cargando…</div></div>
  <div class="card" style="margin-top:14px"><h2>Usuarios con acceso</h2>
  <div class="bar"><input id="uMail" placeholder="correo@${DOMINIO}"><input id="uNom" placeholder="Nombre"><select id="uRol"><option value="lectura">Lectura</option><option value="admin">Admin</option></select><button class="p" onclick="addUser()">Agregar directamente</button><span id="uErr"></span></div>
  <div id="ut">Cargando…</div><div class="mut sm" style="margin-top:8px">Lectura: solo consulta · Admin: asigna, entrega, gestiona licencias, cierra egresos y aprueba accesos.</div></div>
  <div class="card" style="margin-top:14px"><h2>Historial de solicitudes</h2><div id="solH"></div></div>`;
async function renderU(){
  const [{ data:us, error:e1 }, { data:sol, error:e2 }] = await Promise.all([sb.from('usuarios_ti').select('*').order('email'), sb.from('solicitudes_acceso').select('*').order('solicitado', { ascending:false })]);
  if(e1||e2){ document.getElementById('ut').textContent = (e1||e2).message; return; }
  const pend = sol.filter(s => s.estado === 'pendiente');
  document.getElementById('nSol').textContent = pend.length || '';
  document.getElementById('solT').innerHTML = pend.length ? `<table><tr><th>Correo</th><th>Nombre</th><th>Solicitado</th><th>Rol</th><th></th></tr>${pend.map((s,i) => `<tr><td>${esc(s.email)}</td><td>${esc(s.nombre)}</td><td>${new Date(s.solicitado).toLocaleString('es-CL')}</td><td><select id="rol${i}"><option value="lectura">Lectura</option><option value="admin">Admin</option></select></td><td style="white-space:nowrap"><button class="p" onclick="resolver('${esc(s.email)}',true,'rol${i}')">Aprobar</button> <button class="d" onclick="resolver('${esc(s.email)}',false)">Rechazar</button></td></tr>`).join('')}</table>` : '<div class="empty">No hay solicitudes pendientes</div>';
  document.getElementById('ut').innerHTML = `<table><tr><th>Correo</th><th>Nombre</th><th>Rol</th><th></th></tr>${us.map(u => `<tr><td>${esc(u.email)}</td><td>${esc(u.nombre)}</td><td>${u.email===ME?(u.rol==='admin'?'<span class="tag t-pri">Admin</span>':'Lectura'):`<select onchange="cambiarRol('${esc(u.email)}',this.value)"><option value="lectura" ${u.rol==='lectura'?'selected':''}>Lectura</option><option value="admin" ${u.rol==='admin'?'selected':''}>Admin</option></select>`}</td><td>${u.email!==ME?`<button class="d sm" onclick="delUser('${esc(u.email)}')">Quitar acceso</button>`:'<span class="mut sm">tú</span>'}</td></tr>`).join('')}</table>`;
  const hist = sol.filter(s => s.estado !== 'pendiente');
  document.getElementById('solH').innerHTML = hist.length ? `<table><tr><th>Correo</th><th>Estado</th><th>Resuelto</th><th>Por</th><th></th></tr>${hist.map(s => `<tr><td>${esc(s.email)}</td><td>${s.estado==='aprobada'?'<span class="tag t-ok">Aprobada</span>':'<span class="tag t-bad">Rechazada</span>'}</td><td>${s.resuelto?new Date(s.resuelto).toLocaleString('es-CL'):''}</td><td>${esc(s.resuelto_por)}</td><td>${s.estado==='rechazada'?`<button class="sm" onclick="borrarSol('${esc(s.email)}')">Permitir que vuelva a solicitar</button>`:''}</td></tr>`).join('')}</table>` : '<div class="mut">Sin historial</div>';
  pillSol(pend.length);
}
function pillSol(n){ const el = document.getElementById('pSol'); if(el){ el.textContent = n || ''; el.style.display = n ? '' : 'none'; } }
async function resolver(email, aprobar, selId){
  const rol = selId ? document.getElementById(selId).value : 'lectura';
  const { error } = await sb.rpc('resolver_solicitud', { p_email: email, p_aprobar: aprobar, p_rol: rol });
  if(error) toast(error.message); else { toast(aprobar ? 'Acceso aprobado' : 'Solicitud rechazada'); renderU(); }
}
async function addUser(){
  const email = uMail.value.trim().toLowerCase();
  if(!email.endsWith('@'+DOMINIO)){ uErr.innerHTML = '<span class="tag t-bad">Debe ser un correo @'+DOMINIO+'</span>'; return; }
  const { error } = await sb.from('usuarios_ti').upsert({ email, nombre: uNom.value.trim(), rol: uRol.value });
  if(error){ uErr.innerHTML = '<span class="tag t-bad">'+esc(error.message)+'</span>'; return; }
  toast('Usuario agregado'); uMail.value = ''; uNom.value = ''; renderU();
}
async function cambiarRol(email, rol){ const { error } = await sb.from('usuarios_ti').update({ rol }).eq('email', email); toast(error ? error.message : 'Rol actualizado'); }
async function delUser(email){
  const { error } = await sb.from('usuarios_ti').delete().eq('email', email);
  if(error) return toast(error.message);
  await sb.from('solicitudes_acceso').update({ estado:'rechazada', resuelto: new Date().toISOString(), resuelto_por: ME }).eq('email', email);
  toast('Acceso quitado'); renderU();
}
async function borrarSol(email){ const { error } = await sb.from('solicitudes_acceso').delete().eq('email', email); if(error) toast(error.message); else renderU(); }
const _go = go;
go = function(){ _go(); if((location.hash||'').slice(1) === 'usuarios'){ document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.v === 'usuarios')); renderU(); } };
window.removeEventListener('hashchange', _go); window.addEventListener('hashchange', go);

.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1d2433;border:none;border-radius:10px;padding:12px 20px;font-weight:600;font-size:15px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.gbtn:hover{transform:translateY(-1px)}
.gnote{margin-top:16px;font-size:12.5px;color:#7f9cc4}
.gmsg{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.gmsg h2{color:#fff;font-size:17px;margin:0 0 6px}.gmsg p{margin:0;font-size:14px}
.gbtn2{background:transparent;color:#cfe0f7;border:1px solid rgba(255,255,255,.3);border-radius:9px;padding:9px 16px;cursor:pointer;font:inherit}
.gcard{width:460px;max-width:100%;background:rgba(10,38,78,.72);border:1px solid rgba(120,170,230,.18);border-radius:16px;padding:26px 26px 30px;box-shadow:0 20px 60px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.gflow{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
.gst{display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.32;transition:opacity .4s,transform .4s}
.gst.on{opacity:1;transform:translateY(-2px)}
.gst svg{width:38px;height:38px;stroke:#cfe0f7;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.gst.on svg{stroke:#fff;filter:drop-shadow(0 0 6px rgba(120,190,255,.6))}
.gst span{font-size:10.5px;color:#8fb0d9;letter-spacing:.03em}
.gln{flex:1;height:0;border-top:2px dashed rgba(160,200,245,.25);margin:0 6px 18px}
.gln.on{border-color:rgba(160,210,255,.8)}
.gterm{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;line-height:1.75;min-height:96px;color:#cfe0f7}
.gterm .cmd{color:#fff;font-weight:600}.gterm .cmd i{color:#6fc3ff;font-style:normal}
.gterm .ok{color:#7ee2a8}
.gcur{display:inline-block;width:8px;height:15px;background:#cfe0f7;vertical-align:-2px;animation:gb 1s steps(1) infinite}
@keyframes gb{50%{opacity:0}}
@media(max-width:900px){.gbrand h1{font-size:27px}.gwrap{gap:30px}}
</style>`);

function gateHTML(inner){
  return `<canvas id="stars"></canvas><div class="gwrap">
   <div class="gbrand">
     <div class="glogo"><img src="${LOGO}" alt="Ministerio de Ciencia, Tecnología, Conocimiento e Innovación"></div>
     <h1>Inventario Tecnológico</h1>
     <p>Equipos, pantallas, celulares, telefonía IP, accesorios de bodega, licencias y firma electrónica de cada funcionario, en un solo lugar.</p>
     <div id="gin">${inner}</div>
   </div>
   <div class="gcard"><div class="gflow" id="gflow"></div><div class="gterm" id="gterm"></div></div>
  </div>`;
}
function gate(inner){
  let g = document.getElementById('gate');
  if(!g){ g = document.createElement('div'); g.id = 'gate'; document.body.appendChild(g); g.innerHTML = gateHTML(inner); estrellas(); animar(); }
  else document.getElementById('gin').innerHTML = inner;
}
function cerrarGate(){ const g = document.getElementById('gate'); if(g){ g.remove(); cancelAnimationFrame(window._sf); clearTimeout(window._at); } }
function estrellas(){
  const c = document.getElementById('stars'), x = c.getContext('2d'); let W, H, S = [];
  const rs = () => { W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio; S = Array.from({ length: 140 }, () => ({ x: Math.random()*W, y: Math.random()*H, r: (Math.random()*1.3+.3)*devicePixelRatio, a: Math.random(), v: Math.random()*.01+.003, d: (Math.random()*.15+.03)*devicePixelRatio })); };
  rs(); addEventListener('resize', rs);
  (function f(){ x.clearRect(0,0,W,H); S.forEach(s => { s.a += s.v; s.y -= s.d; if(s.y < 0) s.y = H; x.globalAlpha = .35 + .45*Math.abs(Math.sin(s.a)); x.fillStyle = '#cfe6ff'; x.beginPath(); x.arc(s.x, s.y, s.r, 0, 7); x.fill(); }); window._sf = requestAnimationFrame(f); })();
}
function animar(){
  let ei = 0;
  const escena = () => {
    const E = ESCENAS[ei++ % ESCENAS.length];
    document.getElementById('gflow').innerHTML = E.pasos.map((p,i) => (i ? '<div class="gln" id="gl'+i+'"></div>' : '') + `<div class="gst" id="gs${i}">${ICONOS[p[0]]}<span>${p[1]}</span></div>`).join('');
    const term = document.getElementById('gterm'); term.innerHTML = '';
    let li = 0;
    const linea = () => {
      if(!document.getElementById('gterm')) return;
      if(li >= E.lineas.length){ window._at = setTimeout(escena, 2600); return; }
      document.getElementById('gs'+li)?.classList.add('on'); document.getElementById('gl'+li)?.classList.add('on');
      const html = E.lineas[li], tmp = document.createElement('div'); tmp.innerHTML = html; const txt = tmp.textContent;
      const row = document.createElement('div'); term.querySelector('.gcur')?.remove(); term.appendChild(row);
      let k = 0;
      const tipo = () => { k += li === 0 ? 1 : 3; if(k >= txt.length){ row.innerHTML = html + '<span class="gcur"></span>'; li++; window._at = setTimeout(linea, 650); } else { row.textContent = txt.slice(0,k); row.insertAdjacentHTML('beforeend','<span class="gcur"></span>'); window._at = setTimeout(tipo, li === 0 ? 45 : 18); } };
      tipo();
    };
    linea();
  };
  escena();
}

// ---------- Acceso ----------
function pantalla(html){ gate(html); }
async function salir(){ await sb.auth.signOut(); location.reload(); }
async function entrar(){
  await sb.auth.signInWithOAuth({ provider:'google', options:{ redirectTo: location.origin + location.pathname, queryParams:{ hd: DOMINIO, prompt:'select_account' } } });
}
(async function(){
  const nav = document.querySelector('nav');
  nav.querySelector('.brand').insertAdjacentHTML('afterbegin', `<img src="${LOGO}" alt="" style="height:54px;display:block;margin-bottom:12px;border-radius:3px">`);
  nav.insertAdjacentHTML('beforeend', `<a data-v="usuarios" class="adm" onclick="location.hash='usuarios'"><span class="t">Control de acceso</span><span class="pill" id="pSol" style="display:none"></span></a><a onclick="salir()" style="margin-top:20px;opacity:.75"><span class="t">Cerrar sesión</span></a><div class="sm" id="meBox" style="padding:10px;color:#8ea0bd;word-break:break-all"></div>`);
  const ingresar = `<button class="gbtn" onclick="entrar()">${G_ICON} Ingresar con cuenta institucional</button><div class="gnote">Acceso exclusivo para cuentas @${DOMINIO} autorizadas por la Unidad TI.</div>`;
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ gate(ingresar); return; }
  ME = (session.user.email || '').toLowerCase();
  const nombre = session.user.user_metadata?.full_name || '';
  document.getElementById('meBox').textContent = ME;
  if(!ME.endsWith('@' + DOMINIO)){
    await sb.auth.signOut();
    gate(`<div class="gmsg"><h2>Cuenta no permitida</h2><p>${esc(ME)} no pertenece al dominio @${DOMINIO}.</p></div>${ingresar}`); return;
  }
  const { data:u } = await sb.from('usuarios_ti').select('rol').eq('email', ME).maybeSingle();
  if(!u){
    let { data:sol } = await sb.from('solicitudes_acceso').select('estado').eq('email', ME).maybeSingle();
    if(!sol){ await sb.from('solicitudes_acceso').insert({ email: ME, nombre }); sol = { estado:'pendiente', nueva:true }; }
    const msg = sol.estado === 'rechazada'
      ? `<div class="gmsg"><h2>Acceso no autorizado</h2><p>Tu solicitud con ${esc(ME)} fue rechazada. Si crees que es un error, contacta a la Unidad TI.</p></div>`
      : `<div class="gmsg"><h2>${sol.nueva ? 'Solicitud enviada' : 'Solicitud en revisión'}</h2><p>Tu cuenta ${esc(ME)} quedó registrada. Un administrador debe aprobar tu acceso; vuelve a ingresar cuando te avisen.</p></div>`;
    gate(msg + `<button class="gbtn2" onclick="salir()">Cerrar sesión</button>`); return;
  }
  ROL = u.rol;
  gate('<div class="gnote" style="font-size:14px">Cargando inventario…</div>');
  try{
    await start(); cerrarGate();
    if(ROL === 'admin'){ const { count } = await sb.from('solicitudes_acceso').select('*', { count:'exact', head:true }).eq('estado','pendiente'); pillSol(count); }
  }catch(e){ gate(`<div class="gmsg"><h2>Error</h2><p>${esc(e.message)}</p></div><button class="gbtn2" onclick="salir()">Cerrar sesión</button>`); }
})();
